[project]
name = "brain-tumor-seg-demo"
version = "1.0.0"
description = "FastAPI demo for brain tumor segmentation with a 2D U-Net."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Lotfi Belmedrek" },
]
dependencies = [
    "aiofiles>=25.1.0",
    "fastapi>=0.138.0",
    "h5py>=3.16.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.0",
    "numpy>=2.1.3",
    "pillow>=12.2.0",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "tensorflow==2.19.0",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
